<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narad Search - Sarkari Naukri, Admit Card, Result</title>
<style>
  :root { --bg:#f5f7fb; --card:#fff; --ink:#14213d; --mut:#5b6478; --navy:#0b1f4d; --blue:#1e5eff; --line:#e3e8f2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1424; --card:#161e33; --ink:#eef1f8; --mut:#9aa4bd; --navy:#0b1f4d; --blue:#6f9bff; --line:#27314d; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Noto Sans Devanagari",sans-serif; }
  header { background:var(--navy); color:#fff; padding:14px 14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0px)); }
  h1 { margin:0 0 10px; font-size:19px; } h1 small { font-weight:400; opacity:.75; font-size:12px; display:block; }
  .box { display:flex; gap:6px; } input[type=search] { flex:1; min-width:0; padding:12px 14px; border:0; border-radius:10px; font-size:16px; }
  main { max-width:760px; margin:0 auto; padding:10px 12px 40px; }
  .tabs { display:flex; gap:6px; overflow-x:auto; padding:4px 0 8px; }
  .tab { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:7px 14px; border-radius:99px; font-size:13px; white-space:nowrap; cursor:pointer; }
  .tab.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  .meta { color:var(--mut); font-size:12px; margin:2px 2px 8px; }
  .item { display:block; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin:0 0 8px; color:inherit; text-decoration:none; }
  .item .t { font-weight:600; word-break:break-word; } .item .s { color:var(--mut); font-size:12px; margin-top:4px; }
  .b { display:inline-block; font-size:10px; font-weight:700; padding:1px 7px; border-radius:99px; margin-right:6px; vertical-align:1px; }
  .new { background:#e53935; color:#fff; } .job { background:#e3f0ff; color:#0d47a1; } .admit { background:#ffe9d6; color:#b34700; } .result { background:#e1f5e4; color:#1b6e2c; }
  .late { color:#b00020; } .ok { color:#1b6e2c; }
  .warn { background:#fff8e1; color:#5d4a00; border:1px solid #ffe082; border-radius:10px; padding:9px 11px; font-size:12px; margin:8px 0; }
  .empty { text-align:center; color:var(--mut); padding:30px 10px; }
  button.more { width:100%; padding:11px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; font-size:14px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>Narad Search <small>Sarkari bharti, admit card aur result - sirf official sites se</small></h1>
  <div class="box"><input id="q" type="search" placeholder="Jaise: railway group d, bihar police, ssc result" autocomplete="off" autofocus></div>
</header>
<main>
  <div class="tabs" id="tabs"></div>
  <div class="meta" id="meta">Load ho raha hai...</div>
  <div id="list"></div>
  <button class="more" id="more" hidden>Aur dikhao</button>
  <div class="warn">Yahan link official sarkari sites se apne aap jama hote hain. Last date aur yogyata <b>hamesha official notification se jaanch lein</b>. Date tabhi dikhti hai jab site par saaf likhi ho.</div>
</main>
<script src="search.js"></script>
<script>
(function () {
  var data = { items: [], updated: null }, kind = 'all', shown = 30, PAGE = 30;
  var $ = function (id) { return document.getElementById(id); };
  var KINDS = [['all', 'Sab'], ['job', 'Naukri'], ['admit', 'Admit Card'], ['result', 'Result']];
  var KLAB = { job: 'NAUKRI', admit: 'ADMIT CARD', result: 'RESULT' };

  KINDS.forEach(function (k) {
    var b = document.createElement('button');
    b.className = 'tab' + (k[0] === kind ? ' on' : ''); b.textContent = k[1];
    b.onclick = function () { kind = k[0]; shown = PAGE; Array.prototype.forEach.call($('tabs').children, function (c) { c.classList.remove('on'); }); b.classList.add('on'); render(); };
    $('tabs').appendChild(b);
  });

  function lastDateNode(iso) {
    if (!iso) return null;
    var t = Date.parse(iso + 'T23:59:59'); var span = document.createElement('span');
    var p = iso.split('-'); var txt = p[2] + '/' + p[1] + '/' + p[0];
    if (isNaN(t)) return null;
    if (t < Date.now()) { span.className = 'late'; span.textContent = 'Last date nikal gayi: ' + txt; }
    else { span.className = 'ok'; span.textContent = 'Last date: ' + txt; }
    return span;
  }
  function row(r) {
    var it = r.it;
    var a = document.createElement('a'); a.className = 'item';
    if (/^https?:\/\//i.test(it.url)) { a.href = it.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    var t = document.createElement('div'); t.className = 't';
    if (r.age <= 3) { var n = document.createElement('span'); n.className = 'b new'; n.textContent = 'NAYA'; t.appendChild(n); }
    var kb = document.createElement('span'); kb.className = 'b ' + it.kind; kb.textContent = KLAB[it.kind] || ''; t.appendChild(kb);
    t.appendChild(document.createTextNode(it.title));
    var s = document.createElement('div'); s.className = 's';
    s.appendChild(document.createTextNode(it.source + ' \u00b7 '));
    var ld = lastDateNode(it.last_date); if (ld) { s.appendChild(ld); s.appendChild(document.createTextNode(' \u00b7 ')); }
    s.appendChild(document.createTextNode('mila: ' + it.first_seen.split('-').reverse().join('/')));
    var info = [];
    if (it.posts) info.push('Post: ' + it.posts);
    if (it.vacancies) info.push('Vacancy: ' + it.vacancies);
    if (it.qualification) info.push('Yogyata: ' + it.qualification);
    a.appendChild(t);
    if (info.length) { var d = document.createElement('div'); d.className = 's'; d.textContent = info.join(' \u00b7 '); a.appendChild(d); }
    a.appendChild(s); return a;
  }
  var timer;
  function render() {
    var res = NaradSearch.search(data.items, $('q').value, kind);
    var list = $('list'); list.textContent = '';
    res.slice(0, shown).forEach(function (r) { list.appendChild(row(r)); });
    $('more').hidden = res.length <= shown;
    if (!data.items.length) {
      $('meta').textContent = 'Abhi data nahi hai. GitHub me "Crawl" workflow chalayein.';
    } else {
      var up = data.updated ? new Date(data.updated).toLocaleString('en-IN') : '';
      $('meta').textContent = res.length + ' result \u00b7 aakhri update: ' + up;
    }
    if (data.items.length && !res.length) { var e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Kuch nahi mila. Dusre shabd try karein (jaise: police, railway, ssc).'; list.appendChild(e); }
  }
  $('q').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(function () { shown = PAGE; render(); }, 150); });
  $('more').onclick = function () { shown += PAGE; render(); };
  fetch('jobs.json', { cache: 'no-cache' }).then(function (r) { return r.json(); })
    .then(function (j) { data = j; render(); })
    .catch(function () { $('meta').textContent = 'Data load nahi hua. Internet check karein.'; });
})();
</script>
</body>
</html>
