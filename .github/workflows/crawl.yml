name: Crawl
on:
  schedule:
    - cron: '0 */6 * * *'   # har 6 ghante
  workflow_dispatch:         # haath se chalane ke liye
permissions:
  contents: write
concurrency:
  group: crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PDF padhne ka tool
        run: pip install pypdf
      - name: Sarkari sites padho, AI se naye jobs padhwao, purane hatao
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python crawler/crawl.py
      - name: Naya data repo me daalo
        run: |
          git config user.name "narad-bot"
          git config user.email "narad-bot@users.noreply.github.com"
          git add docs/jobs.json docs/status.json data/dead.json
          git diff --cached --quiet || git commit -m "Update jobs $(date -u +%F)"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
