name: Build APK

on:
  push:
    branches: [ main, master ]
    # crawler / data / search page badalne par APK dobara nahi banega
    paths-ignore:
      - 'docs/**'
      - 'data/**'
      - 'crawler/**'
      - '**.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          # Jobs isi repo ki docs/jobs.json se (raw link commit ke turant baad update hota hai; repo PUBLIC rakhein)
          JOBS_URL: ${{ vars.JOBS_URL || format('https://raw.githubusercontent.com/{0}/{1}/{2}/docs/jobs.json', github.repository_owner, github.event.repository.name, github.event.repository.default_branch) }}
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NaradAI-debug-apk
          path: '**/build/outputs/apk/**/*.apk'